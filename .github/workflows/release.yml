name: Release

on:
  push:
    tags:
      - 'v[0-9]*'          # CLI release tags only — `sdk/*` module tags never trigger this
  pull_request:
    paths:                 # validate the release config on PRs that touch it (snapshot, no publish)
      - '.goreleaser.yaml'
      - '.github/workflows/release.yml'

# Default every job to read-only. Only the publish job below elevates to write,
# so the PR/snapshot path carries no write-capable token even while it builds PR
# code (GitHub does not allow expressions in `permissions:`, hence two jobs).
permissions:
  contents: read

jobs:
  # Tag push -> real cross-platform build + (draft) GitHub release.
  release:
    name: GoReleaser (release)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release and upload assets
      id-token: write      # keyless cosign signing via Sigstore OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # GoReleaser needs full history + tags for the changelog

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The tag is already pushed by the time this runs, so this is the last
      # point at which a stale SDK pin can be caught. Every other job builds
      # inside the committed go.work and resolves the in-tree SDK, so none of
      # them sees a go.mod that still pins an older sdk — while
      # `go install .../cmd/taskmgr@<this tag>` compiles against exactly that pin
      # and fails for every user. Fail here, loudly, instead of publishing it.
      - name: Verify the SDK pin resolves (go install path)
        run: |
          if ! GOWORK=off go build ./...; then
            echo "::error::go.mod pins an SDK version this tag does not build against."
            echo "::error::Push sdk/${GITHUB_REF_NAME} and re-pin the CLI before tagging — docs/RELEASING.md step 4."
            exit 1
          fi

      # cosign-release pins the cosign BINARY, not just the action. Without it the
      # installer fetches the latest cosign, so a new major lands in the release
      # job unannounced — which is how v0.7.0 failed: cosign 3.x makes
      # --new-bundle-format the default, which silently ignores the
      # --output-signature / --output-certificate flags .goreleaser.yaml passes and
      # then aborts on an empty --bundle path ("create bundle file: open : no such
      # file or directory"). Every other supply-chain input here is pinned; this
      # one was the exception.
      #
      # Moving to the 3.x bundle format is a separate change: it replaces the
      # published checksums.txt.sig + .pem with a single .bundle and changes the
      # verify-blob invocation documented in docs/RELEASING.md.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the tag so the parallel `sdk/v*` tag on the same commit is never picked up.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

  # PR touching the release config -> snapshot build only (no publish, read-only
  # token). Catches a broken .goreleaser.yaml before any tag is ever cut.
  validate:
    name: GoReleaser (snapshot)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          # Snapshot validation has no cosign/syft installed, so skip those steps.
          args: release --snapshot --clean --skip=sign,sbom
