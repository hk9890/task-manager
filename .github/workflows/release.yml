name: Release

on:
  push:
    tags:
      - 'v[0-9]*'          # CLI release tags only — `sdk/*` module tags never trigger this
  pull_request:
    paths:                 # validate the release config on PRs that touch it (snapshot, no publish)
      - '.goreleaser.yaml'
      - '.github/workflows/release.yml'
  # Both of these run the release job below as a DRY RUN — every step of the real
  # thing, `--snapshot`, no publish. It is the only place signing and SBOM
  # generation happen before a tag exists, and a tag cannot be taken back: the Go
  # module proxy caches `vX.Y.Z` the moment it is pushed, so a release that dies
  # after tagging burns the version (that is what happened to v0.7.0). The
  # pull_request path cannot cover signing — keyless cosign needs `id-token:
  # write`, which must never be handed to unreviewed PR code.
  workflow_dispatch:       # required before pushing a tag — docs/RELEASING.md step 5
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC: surface toolchain drift on its own

# Default every job to read-only. Only the publish job below elevates to write,
# so the PR/snapshot path carries no write-capable token even while it builds PR
# code (GitHub does not allow expressions in `permissions:`, hence two jobs).
permissions:
  contents: read

jobs:
  # Tag push -> real cross-platform build + (draft) GitHub release.
  # Dispatch / schedule -> the same job with `--snapshot`: builds, signs and
  # catalogs, publishes nothing. Deliberately one job and not two, so the
  # rehearsal cannot drift away from the release it is rehearsing.
  release:
    name: GoReleaser (${{ github.event_name == 'push' && 'release' || 'dry run' }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release and upload assets (tag push only; a dry run publishes nothing)
      id-token: write      # keyless cosign signing via Sigstore OIDC
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # GoReleaser needs full history + tags for the changelog

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Every other job builds inside the committed go.work and resolves the
      # in-tree SDK, so none of them sees a go.mod that still pins an older sdk —
      # while `go install .../cmd/taskmgr@<tag>` compiles against exactly that pin
      # and fails for every user. On a tag push this is the last point at which a
      # stale pin can be caught, and the tag is already public by then; on a
      # dispatched dry run it is a real gate, which is the point of running one.
      #
      # Skipped on the weekly schedule: this is a release-readiness gate, not a
      # drift check. Between releases the CLI legitimately uses SDK symbols that
      # are not published yet, so it is *expected* to fail on an arbitrary main —
      # which is why `.mise.toml` keeps `verify:pin` out of `quality` too. Running
      # it every Monday would just teach everyone to ignore a red release run.
      - name: Verify the SDK pin resolves (go install path)
        if: github.event_name != 'schedule'
        run: |
          if ! GOWORK=off go build ./...; then
            echo "::error::go.mod pins an SDK version this commit does not build against."
            echo "::error::Push the matching sdk/vX.Y.Z tag and re-pin the CLI before tagging — docs/RELEASING.md step 4."
            exit 1
          fi

      # cosign-release pins the cosign BINARY, not just the action. Without it the
      # installer fetches the latest cosign, so a new major lands in the release
      # job unannounced — which is how v0.7.0 failed: the 2.x config here passed
      # --output-signature / --output-certificate, which 3.x does not accept, and
      # the run aborted on an empty --bundle path ("create bundle file: open : no
      # such file or directory"). Every other supply-chain input here is pinned;
      # this one was the exception.
      #
      # 3.x signs into one bundle and nothing else: sign-blob has no
      # --output-signature or --output-certificate, and no --new-bundle-format to
      # turn the old pair back on. verify-blob dropped --signature / --certificate
      # to match, so a 3.x binary cannot verify a release signed by 2.x either.
      # That is why the move is a clean break rather than a transition, and why
      # the published artifact and the verify command in docs/RELEASING.md both
      # changed with it.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      # GoReleaser must never resolve the tag itself here. Releases carry a
      # parallel `sdk/vX.Y.Z` tag on the same history — usually one commit behind
      # the CLI tag, since the SDK has to be published before the CLI can pin it —
      # so a bare `git describe` can land on `sdk/v0.7.0`, which is not semver and
      # is not this artifact. A tag push knows its own tag; a dry run takes the
      # newest CLI tag, `--match` keeping the sdk tags out.
      - name: Resolve the tag GoReleaser builds against
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "GORELEASER_CURRENT_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          else
            tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
            echo "GORELEASER_CURRENT_TAG=${tag}" >> "$GITHUB_ENV"
            echo "Dry run: building a snapshot off ${tag}"
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          # `--snapshot` off a tag push: same build, same signing, same SBOMs, but
          # no GitHub release and no assets uploaded.
          args: release --clean ${{ github.event_name != 'push' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GORELEASER_CURRENT_TAG comes from the step above, via $GITHUB_ENV.

  # PR touching the release config -> snapshot build only (no publish, read-only
  # token). Catches a broken .goreleaser.yaml before any tag is ever cut.
  validate:
    name: GoReleaser (snapshot)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          # No cosign/syft here, and no id-token to sign with even if there were:
          # this job builds unreviewed PR code. Signing is covered by the dry run
          # (`workflow_dispatch` on the release job), not by this path.
          args: release --snapshot --clean --skip=sign,sbom
