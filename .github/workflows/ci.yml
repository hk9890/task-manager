name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege default token: build/test/lint only need read access.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # ── root module ───────────────────────────────────────────────────────

      # 2>&1 folds gofmt's own diagnostics into $out so a broken run cannot pass.
      - name: fmt-check (root)
        run: |
          if ! out="$(gofmt -l cmd sdk/tasks 2>&1)"; then
            echo "gofmt failed:"
            echo "$out"
            exit 1
          fi
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: vet (root)
        run: go vet ./...

      # -race needs CGO; ubuntu-latest ships a C compiler. The race detector
      # guards the single-writer locking invariant (see the flock test, which
      # is integration-tagged) and any other concurrent paths.
      - name: test (root)
        run: CGO_ENABLED=1 go test -race ./...

      - name: test integration (root)
        run: CGO_ENABLED=1 go test -race -tags integration ./...

      # ── sdk module ────────────────────────────────────────────────────────

      - name: fmt-check (sdk)
        working-directory: sdk
        run: |
          if ! out="$(gofmt -l . 2>&1)"; then
            echo "gofmt failed:"
            echo "$out"
            exit 1
          fi
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: vet (sdk)
        working-directory: sdk
        run: go vet ./...

      - name: test (sdk)
        working-directory: sdk
        run: CGO_ENABLED=1 go test -race ./...

      - name: test integration (sdk)
        working-directory: sdk
        run: CGO_ENABLED=1 go test -race -tags integration ./...

      # ── bench module (standalone; excluded from root/sdk build) ──────────

      - name: build (bench)
        working-directory: bench
        run: go build ./...

      - name: vet (bench)
        working-directory: bench
        run: go vet ./...

      # ── fuzz seed corpora (no-ops if no fuzz targets exist yet) ──────────

      - name: fuzz seeds (sdk)
        working-directory: sdk
        run: CGO_ENABLED=1 go test -run=Fuzz ./...

      # ── binary ────────────────────────────────────────────────────────────

      - name: build taskmgr
        run: go build -o bin/taskmgr ./cmd/taskmgr

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise (pins go + golangci-lint 2.1.6)
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

      - name: golangci-lint (both modules)
        run: mise run lint
