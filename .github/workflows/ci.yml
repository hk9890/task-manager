name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least-privilege default token: build/test/lint only need read access.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Formatting is checked in the Lint job, which already has mise. It cannot
      # run here: mise-action exports .mise.toml's [env], including
      # CGO_ENABLED=0, into the job — and the race detector below needs cgo.

      # ── root module ───────────────────────────────────────────────────────

      - name: vet (root)
        run: go vet ./...

      # -race needs CGO; ubuntu-latest ships a C compiler. The race detector
      # guards the single-writer locking invariant (see the flock test, which
      # is integration-tagged) and any other concurrent paths.
      - name: test (root)
        run: CGO_ENABLED=1 go test -race ./...

      - name: test integration (root)
        run: CGO_ENABLED=1 go test -race -tags integration ./...

      # ── sdk module ────────────────────────────────────────────────────────

      - name: vet (sdk)
        working-directory: sdk
        run: go vet ./...

      - name: test (sdk)
        working-directory: sdk
        run: CGO_ENABLED=1 go test -race ./...

      - name: test integration (sdk)
        working-directory: sdk
        run: CGO_ENABLED=1 go test -race -tags integration ./...

      # ── fuzz seed corpora (no-ops if no fuzz targets exist yet) ──────────

      - name: fuzz seeds (sdk)
        working-directory: sdk
        run: CGO_ENABLED=1 go test -run=Fuzz ./...

      # ── binary ────────────────────────────────────────────────────────────

      - name: build taskmgr
        run: go build -o bin/taskmgr ./cmd/taskmgr

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up mise (pins go + goimports + golangci-lint 2.1.6)
        uses: jdx/mise-action@f10502fc09dadecfefb962fff68ce77213930204 # v4.2.2

      # The format gate is defined once, in .mise.toml, and run from there —
      # never re-spelled here as `gofmt`. goimports with -local also enforces the
      # import grouping plain gofmt has no opinion on, so a gofmt-shaped copy of
      # this check accepts files the canonical gate rejects.
      - name: fmt-check (both modules)
        run: mise run fmt:check

      - name: golangci-lint (both modules)
        run: mise run lint

      # The doc gate. It reads the working tree, so it needs no toolchain beyond
      # the go mise already pins. docs/DOCUMENTING.md owns what it rejects.
      - name: check:docs
        run: mise run check:docs

      # The vulnerability scan. The `vuln` task and its govulncheck pin existed
      # in .mise.toml but no gate, workflow or document ran them, so every
      # contributor downloaded the scanner and nothing ever scanned — assurance
      # with nothing behind it. It runs here rather than in the pre-commit gate
      # because it reaches the network for the vulnerability database.
      - name: vuln (both modules)
        run: mise run vuln
