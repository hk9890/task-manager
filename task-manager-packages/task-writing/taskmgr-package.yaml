version: 1

# task-writing — the body standard, stated in prose and enforced at the gate.
#
# The guide fragment is the half that teaches: `taskmgr guide` prints it, so an
# agent reads the rule before its first create. The hooks are the half that
# holds: a body that skips a section is refused with the reason. Neither can
# drift from the other — they ship in one directory, at one version.

# This package states no `overview:` fragment, and the choice is deliberate. Its
# rule governs one job — writing an issue body — so it belongs inside that job,
# where it reaches the caller that is about to file and costs nothing to the
# caller doing something else. The overview still says the job has extra rules,
# because `into:` is what puts that marker on the job's line.
#
# An `overview:` fragment is for a rule with no job to hang it on: one that
# governs every command in the store.
guide:
  # The gate's own rule, printed inside `taskmgr guide filing`.
  - id: filing
    into: filing
    file: ./guide/filing.md

  # Choosing a type, the six rules, the templates. A job of its own: it is read
  # when deciding what to write, not when writing it.
  - id: types
    file: ./guide/types.md

  # Turning a review, a plan or a spec into a set: grounding, one issue per what,
  # real edges, approval before filing. A job of its own — it is the work before
  # the first body exists, so it belongs to no single create.
  - id: decomposing
    file: ./guide/decomposing.md

hooks:
  # Work types carry Context / Problem / Recommended action / Acceptance
  # criteria. An epic carries a different four (its own hook, below) and a doc
  # carries none at all — it holds a document, not a path through work.
  - id: body-sections
    event: pre-create
    when: 'type != "doc" && type != "epic"'
    run: ["./hooks/body-sections.sh"]

  - id: body-sections-update
    event: pre-update
    when: 'type != "doc" && type != "epic"'
    run: ["./hooks/body-sections.sh"]

  - id: epic-sections
    event: pre-create
    when: 'type == "epic"'
    run: ["./hooks/body-sections.sh", "--epic"]

  - id: epic-sections-update
    event: pre-update
    when: 'type == "epic"'
    run: ["./hooks/body-sections.sh", "--epic"]
