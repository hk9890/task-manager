[tools]
go = "1.26.3"
"go:gotest.tools/gotestsum" = "1.13.0"
"go:golang.org/x/tools/cmd/goimports" = "0.30.0"
"go:github.com/golangci/golangci-lint/v2/cmd/golangci-lint" = "2.1.6"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.1.4"

[env]
CGO_ENABLED = "0"

# ---- build & run -----------------------------------------------------------

[tasks.taskmgr]
description = "Build taskmgr from the current source and run it in your shell's directory. Usage: mise run taskmgr -- <args>  (e.g. mise run taskmgr -- ready)"
# Single line so mise appends your args to the taskmgr invocation (not the build step).
run = 'cd "$MISE_PROJECT_ROOT" && go build -o bin/taskmgr ./cmd/taskmgr && cd "${MISE_ORIGINAL_CWD:-$PWD}" && exec "$MISE_PROJECT_ROOT/bin/taskmgr"'

[tasks.build]
description = "Build the taskmgr binary into ./bin"
run = """
# Restrict to `v*` CLI tags (as the makefile does) so the parallel `sdk/*` tags
# on the same commit cannot stamp the binary "sdk/vX.Y.Z".
VERSION=$(git describe --tags --match "v[0-9]*" --exclude "sdk/*" --always --dirty 2>/dev/null || echo dev)
COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo unknown)
DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
PKG=github.com/hk9890/task-manager/cmd
go build -ldflags "-s -w -X $PKG.Version=$VERSION -X $PKG.Commit=$COMMIT -X $PKG.Date=$DATE" -o bin/taskmgr ./cmd/taskmgr
"""

# ---- format / vet / lint / tidy (both modules) -----------------------------

[tasks.fmt]
description = "Format Go source (goimports, both modules)"
run = "goimports -local github.com/hk9890/task-manager -w cmd sdk/tasks scripts"

[tasks."fmt:check"]
description = "Fail if any file is not formatted"
run = """
# 2>&1 folds goimports' own diagnostics into $OUT so a broken run cannot pass.
OUT=$(goimports -local github.com/hk9890/task-manager -l cmd sdk/tasks scripts 2>&1) || { echo "goimports failed:"; echo "$OUT"; exit 1; }
if [ -n "$OUT" ]; then echo "unformatted:"; echo "$OUT"; exit 1; fi
"""

[tasks.vet]
description = "go vet (both modules)"
run = """
go vet ./...
(cd sdk && go vet ./...)
"""

[tasks."build:all"]
description = "Compile every module (root, sdk)"
run = """
go build ./...
(cd sdk && go build ./...)
"""

[tasks."test:fuzz"]
description = "Run fuzz seed corpora for the sdk module (no-ops cleanly if no fuzz targets exist yet)"
dir = "sdk"
run = "go test -run=Fuzz ./..."
[tasks."test:fuzz".env]
CGO_ENABLED = "1"

[tasks.lint]
description = "golangci-lint at pinned version (both modules)"
run = """
golangci-lint run --timeout=5m ./...
(cd sdk && golangci-lint run --timeout=5m ./...)
"""

[tasks.tidy]
description = "go mod tidy (both modules)"
run = """
go mod tidy
(cd sdk && go mod tidy)
"""

[tasks.vuln]
description = "govulncheck (both modules)"
run = """
govulncheck ./...
(cd sdk && govulncheck ./...)
"""

# ---- tests -----------------------------------------------------------------
# L1 (pure) + L2 (store on vfs.Mem) run by default; L3 (real temp dir) + L4 (CLI)
# are gated behind the `integration` build tag. See docs/implementation/TESTING-STRATEGY.md.

[tasks.test]
description = "L1 pure + L2 store-on-Mem — fast, both modules"
run = """
gotestsum --format pkgname-and-test-fails -- -race ./...
(cd sdk && gotestsum --format pkgname-and-test-fails -- -race ./...)
"""
[tasks.test.env]
CGO_ENABLED = "1"

[tasks."test:sdk"]
description = "SDK module tests only (fast)"
dir = "sdk"
run = "gotestsum --format pkgname-and-test-fails -- -race ./..."
[tasks."test:sdk".env]
CGO_ENABLED = "1"

[tasks."test:cli"]
description = "CLI module tests only (fast)"
run = "gotestsum --format pkgname-and-test-fails -- -race ./..."
[tasks."test:cli".env]
CGO_ENABLED = "1"

[tasks."test:integration"]
description = "L3 real temp dir + L4 CLI (integration build tag, both modules)"
run = """
gotestsum --format pkgname-and-test-fails -- -race -tags=integration ./...
(cd sdk && gotestsum --format pkgname-and-test-fails -- -race -tags=integration ./...)
"""
[tasks."test:integration".env]
CGO_ENABLED = "1"

[tasks."test:all"]
description = "All layers (L1-L4, both modules)"
depends = ["test", "test:integration"]

[tasks."test:coverage"]
description = "All layers with a coverage threshold (COVERAGE_THRESHOLD, default 75)"
run = """
go test -race -tags=integration -coverprofile=coverage.out -covermode=atomic ./...
COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
echo "Total coverage: ${COVERAGE}% (threshold: ${COVERAGE_THRESHOLD:-75}%)"
if [ "${COVERAGE%.*}" -lt "${COVERAGE_THRESHOLD:-75}" ]; then echo "FAIL: below threshold"; exit 1; fi
"""
[tasks."test:coverage".env]
CGO_ENABLED = "1"

[tasks."test:coverage:summary"]
description = "Per-package coverage for both modules, ranked least-covered first. Reports; gates nothing."
run = """
# Deliberately NOT part of `quality` or `quality:full`. A coverage floor invites
# tests written to raise a number rather than to pin behaviour, which is the
# failure mode this repository has already produced: three tests named for a
# directory fsync that asserted only that the call returned nil. What the summary
# is for is the other half — showing which lines no test executes at all, which
# was invisible between audits.
#
# Coverage is a pointer, not a verdict: a covered line is a line that RAN, not one
# whose behaviour anything asserted. Read a low number as a place to look.
set -e
for mod in . sdk; do
  echo "── $mod ──"
  ( cd "$mod" && go test -tags=integration -coverprofile=coverage.out -covermode=atomic ./... >/dev/null 2>&1 || true
    go tool cover -func=coverage.out | awk '$1 != "total:" {print}' | sort -k3 -n | head -25
    go tool cover -func=coverage.out | grep total:
    rm -f coverage.out )
done
"""
[tasks."test:coverage:summary".env]
CGO_ENABLED = "1"

# ---- gates -----------------------------------------------------------------

[tasks."check:docs"]
description = "Doc gate: cited source paths resolve, no line-anchored citations, links and anchors resolve, the user guide stays user-facing"
run = "go run ./scripts/checkdocs"

[tasks."verify:pin"]
description = "Build the CLI against the SDK version pinned in go.mod, without the workspace — the check that 'go install .../cmd/taskmgr@vX.Y.Z' will compile"
run = """
# Every local build and every CI job runs inside the committed go.work, which
# wires the CLI to the in-tree SDK. A go.mod still pinning an older sdk therefore
# builds green everywhere while `go install .../cmd/taskmgr@vX.Y.Z` fails to
# compile for users. GOWORK=off resolves the pin the way a consumer does, so this
# is the only check that sees the gap.
#
# It is deliberately NOT part of `quality`: between releases the CLI legitimately
# uses SDK symbols that are not published yet. It gates the release instead
# (docs/RELEASING.md step 4).
GOWORK=off go build ./... || {
  echo ""
  echo "The CLI does not build against the SDK version pinned in go.mod."
  echo "Push the sdk/vX.Y.Z tag and re-pin before tagging the CLI:"
  echo "  GOWORK=off go get github.com/hk9890/task-manager/sdk@vX.Y.Z && GOWORK=off go mod tidy"
  echo "See docs/RELEASING.md step 4."
  exit 1
}
"""

[tasks.quality]
description = "Fast pre-commit gate: fmt + vet + lint + docs + L1/L2 tests + build all modules + fuzz seeds"
depends = ["fmt:check", "vet", "build:all", "lint", "check:docs", "test", "test:fuzz"]

[tasks."quality:full"]
description = "Pre-handoff gate: fmt + vet + lint + docs + all layers + build all modules + fuzz seeds"
depends = ["fmt:check", "vet", "build:all", "lint", "check:docs", "test", "test:integration", "test:fuzz"]
